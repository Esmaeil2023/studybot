[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studybot"
version = "0.1.0"
description = "Bilingual (DE/EN) RAG over university study regulations, with a measured evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24.3",   # PDF text extraction (import name: pymupdf)
    "pyyaml>=6",         # config files
    "snowballstemmer>=2.2",  # German/English stemming for BM25
]

[project.optional-dependencies]
dense = [
    "numpy>=1.26",
    "sentence-transformers>=3",  # multilingual-e5 embeddings
]
llm = [
    "anthropic>=0.40",  # answer generation (Claude API)
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",  # FastAPI's test client
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]     # so `pytest` works even before `pip install -e .`

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
