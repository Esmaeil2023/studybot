# Questions the three documents cannot answer. A good system says "not in the documents".
#
# kind: off-topic   - a study-related topic the documents never mention
#       near-miss   - sounds answerable, but the documents give only part of the answer or
#                     speak about something else (the hard cases)
# absent:           - regular expressions (case-insensitive) that must NOT occur in any chunk;
#                     `python -m studybot.evalset` checks this, so a "gap" is a verified gap.
# why:              - what the documents do say, for the reviewer.

